name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      # the title linter reads the PR
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            upstream
            deps
            chart
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            Subject must be 100 characters or less.

      - name: Forbid breaking chart commits
        # chart commits must never carry the breaking marker: release-please
        # renders BREAKING CHANGE commits in app release notes even for
        # hidden types, defeating the chart/app segregation.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "${TITLE}" in
            chart!*|"chart("*")!:"*)
              echo "::error::chart commits must not be breaking (chart!:). Breaking commits always surface in app release notes. Use a plain chart: commit; chart majors are driven by feat!/fix! under deploy/chart or a one-shot release-as."
              exit 1
              ;;
          esac

  release-notes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # pull_request_target checks out the base branch, so the check never
      # runs code from the pull request it judges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check release notes section
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/release-notes.mjs check
