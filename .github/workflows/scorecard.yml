name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches:
      - main

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scheduled runs are reserved for the canonical repository; forks retain push checks.
    if: github.event_name != 'schedule' || github.repository == 'container-registry/container-registry'
    # Scorecard result publishing requires a single GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-26.04
    permissions:
      # uploads the SARIF to the code-scanning dashboard
      security-events: write
      # publishes the result and mints the badge
      id-token: write
      contents: read
      # the checks read workflow runs, commits, PRs and check results
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
