# CodeQL static analysis for the Go backend and the Angular/TypeScript portal.
# Results appear under Security -> Code scanning.
# Go requires a build for analysis (autobuild); JS/TS is scanned without one.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '25 3 * * 2'

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Keep CodeQL available to fork pushes and PRs; reserve its scheduled scan for the canonical repo.
    if: github.event_name != 'schedule' || github.repository == 'container-registry/container-registry'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Go version
        id: versions
        if: matrix.language == 'go'
        run: |
          go_version="$(sed -n 's/^GO_VERSION=//p' versions.env)"
          if ! [[ "${go_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GO_VERSION in versions.env must be X.Y.Z" >&2
            exit 1
          fi
          echo "go-version=${go_version}" >> "${GITHUB_OUTPUT}"

      - if: matrix.language == 'go'
        uses: $/.github/actions/setup-go-cached
        with:
          go-version: ${{ steps.versions.outputs.go-version }}
          go-sum-path: src/go.sum

      - if: matrix.language == 'go'
        uses: $/.github/actions/setup-task
        with:
          version: 3.49.1

      # The swagger server packages are not committed; without them the Go
      # extractor cannot resolve server/v2.0 and drops types from the API handlers.
      - name: Generate API code
        if: matrix.language == 'go'
        run: task build:gen-apis

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
