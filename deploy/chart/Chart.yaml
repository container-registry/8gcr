apiVersion: v2
name: harbor
description: A modern, production-ready Helm chart for
  [8gcr](https://github.com/container-registry/container-registry) - the cloud-native
  container registry for Kubernetes.
type: application
version: 2.1.2
# appVersion is stamped by the app release commit through the marker below;
# version is stamped by the chart release PR on the same release branch.
appVersion: "v2.15.15"  # x-release-please-version
kubeVersion: ">=1.28.0-0"

home: https://github.com/container-registry/container-registry
icon: https://raw.githubusercontent.com/container-registry/container-registry/refs/heads/main/docs/img/8gcr-logo.svg
sources:
  - https://github.com/container-registry/container-registry

keywords:
  - harbor
  - container-registry
  - registry
  - oci
  - docker
  - artifacts
  - vulnerability-scanning
  - image-registry
  - cloud-native
  - cncf
  - helm

maintainers:
  - name: 8gcr Authors
    url: https://github.com/container-registry/container-registry

dependencies:
  - name: valkey
    version: "0.9.3"
    repository: "oci://ghcr.io/valkey-io/valkey-helm"
    condition: valkey.enabled

# Artifact Hub metadata (https://artifacthub.io/docs/topics/annotations/helm/).
# Keep this the LAST top-level key: the release pipeline appends the
# per-release artifacthub.io/images annotation to this block before
# packaging (image tags are only known at release time).
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/container-registry/container-registry
    - name: Source Helm Chart
      url: https://github.com/container-registry/container-registry/tree/main/deploy/chart
    - name: Migration from goharbor/harbor-helm
      url: https://github.com/container-registry/container-registry/blob/main/deploy/chart/docs/MIGRATION.md
    - name: Upstream Harbor
      url: https://goharbor.io
