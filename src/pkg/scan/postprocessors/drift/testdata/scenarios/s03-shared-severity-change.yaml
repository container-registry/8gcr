name: s03-shared-severity-change
description: >-
  Two artifacts share a record. A rescan of one with a changed severity updates the shared row, so the
  other artifact shows the new severity too while its stored counters keep the old one.
steps:
  - {op: register_scanner, scanner: s1}
  - op: scan
    artifact: a1
    scanner: s1
    report: &high
      generated_at: "2026-11-25T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: High
      vulnerabilities:
        - {id: CVE-2026-0201, package: openssl, version: 3.0.1-r0, fix_version: 3.0.2-r0, severity: High, status: fixed, preferred_cvss: {score_v3: 7.5}}
        - {id: CVE-2026-0202, package: zlib, version: 1.2.13-r0, severity: Low, status: affected}
  - {op: scan, artifact: a2, scanner: s1, report: *high}
  - {op: capture, label: before}
  - op: scan
    artifact: a1
    scanner: s1
    report:
      generated_at: "2026-11-26T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: Critical
      vulnerabilities:
        - {id: CVE-2026-0201, package: openssl, version: 3.0.1-r0, fix_version: 3.0.2-r0, severity: Critical, status: fixed, preferred_cvss: {score_v3: 9.1}}
        - {id: CVE-2026-0202, package: zlib, version: 1.2.13-r0, severity: Low, status: affected}
  - {op: capture, label: after-severity-change}
