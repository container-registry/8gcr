name: s22-update-drops-vendor-score
description: >-
  A record whose CVSS v3 score came from the vendor attributes loses it on the first update: the
  update writes the report's preferred_cvss score, which is empty.
steps:
  - {op: register_scanner, scanner: s1}
  - op: scan
    artifact: a1
    scanner: s1
    report:
      generated_at: "2026-11-25T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: High
      vulnerabilities:
        - {id: CVE-2026-2201, package: openssl, version: 3.0.1-r0, severity: High, status: affected, vendor_attributes: {CVSS: {nvd: {V3Score: 8.1}}}}
  - {op: capture, label: before}
  - op: scan
    artifact: a1
    scanner: s1
    report:
      generated_at: "2026-11-26T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: Critical
      vulnerabilities:
        - {id: CVE-2026-2201, package: openssl, version: 3.0.1-r0, severity: Critical, status: affected, vendor_attributes: {CVSS: {nvd: {V3Score: 9.1}}}}
  - {op: capture, label: after-update}
