name: s04-fix-version-only-change
description: >-
  A rescan where only fix_version and the CVSS score changed. The current code updates an existing
  record only when severity or status changed, so the stored fix_version and score stay stale while
  the counters (computed from the report) count the item as fixable.
steps:
  - {op: register_scanner, scanner: s1}
  - op: scan
    artifact: a1
    scanner: s1
    report:
      generated_at: "2026-11-25T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: High
      vulnerabilities:
        - {id: CVE-2026-0301, package: openssl, version: 3.0.1-r0, severity: High, status: affected, preferred_cvss: {score_v3: 7.5}}
  - {op: capture, label: before}
  - op: scan
    artifact: a1
    scanner: s1
    report:
      generated_at: "2026-11-26T10:00:00Z"
      scanner: {name: Trivy, vendor: Aqua Security, version: v0.60.0}
      severity: High
      vulnerabilities:
        - {id: CVE-2026-0301, package: openssl, version: 3.0.1-r0, fix_version: 3.0.2-r0, severity: High, status: affected, preferred_cvss: {score_v3: 8.1}}
  - {op: capture, label: after-fix-only-change, rows_unchanged: true}
